name: Android Auto Build, Release & Distribute APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
  workflow_dispatch:
    inputs:
      release_notes:
        description: 'Release notes (English)'
        required: false
        default: 'Automatic build with latest diagnostics, localization & stability updates.'
      release_notes_hi:
        description: 'Release notes (Hindi Devanagari)'
        required: false
        default: 'नवीनतम निदान, भाषा सुधार और स्थिरता अपडेट के साथ स्वचालित बिल्ड।'

permissions:
  contents: write

jobs:
  build_test_and_publish:
    name: Build, Verify & Publish Signed APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Compute Monotonic Version Code & Name
        id: version
        run: |
          BASE_CODE=100
          RUN_NUM=${{ github.run_number }}
          VERSION_CODE=$((BASE_CODE + RUN_NUM))
          VERSION_NAME="1.1.${RUN_NUM}"
          RELEASE_DATE_UTC=$(date -u +"%Y-%m-%d %H:%M UTC")
          PUBLISHED_AT=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          echo "VERSION_CODE=${VERSION_CODE}" >> "$GITHUB_OUTPUT"
          echo "VERSION_NAME=${VERSION_NAME}" >> "$GITHUB_OUTPUT"
          echo "RELEASE_DATE_UTC=${RELEASE_DATE_UTC}" >> "$GITHUB_OUTPUT"
          echo "PUBLISHED_AT=${PUBLISHED_AT}" >> "$GITHUB_OUTPUT"
          echo "Computed Version: v${VERSION_NAME} (versionCode=${VERSION_CODE}) on ${RELEASE_DATE_UTC}"

      - name: Prepare CI Signing & Non-Secret Config
        id: prep
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          DEBUG_KEYSTORE_BASE64: ${{ secrets.DEBUG_KEYSTORE_BASE64 }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_CREDENTIAL_FILE_CONTENT: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
        run: |
          # SECURITY: Never bake GEMINI_API_KEY into the APK.
          # Cloud AI uses Firebase AI Logic + App Check or server-side backend/ proxy.
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s\n' "$GOOGLE_SERVICES_JSON" > app/google-services.json
          fi

          if [ -n "$FIREBASE_APP_ID" ] && [ -n "$FIREBASE_CREDENTIAL_FILE_CONTENT" ]; then
            echo "HAS_FIREBASE_DIST=true" >> "$GITHUB_OUTPUT"
          else
            echo "HAS_FIREBASE_DIST=false" >> "$GITHUB_OUTPUT"
          fi

          if [ -n "$RELEASE_KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            printf '%s' "$RELEASE_KEYSTORE_BASE64" | base64 --decode > my-upload-key.jks
            echo "SIGN_MODE=release" >> "$GITHUB_ENV"
            echo "KEYSTORE_PATH=${{ github.workspace }}/my-upload-key.jks" >> "$GITHUB_ENV"
          elif [ -n "$DEBUG_KEYSTORE_BASE64" ]; then
            printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > debug.keystore
            echo "SIGN_MODE=debug" >> "$GITHUB_ENV"
          else
            echo "::warning::No RELEASE_KEYSTORE_BASE64 or DEBUG_KEYSTORE_BASE64 secret found. Generating ephemeral debug.keystore (in-place upgrades require a persistent keystore secret)."
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
            echo "SIGN_MODE=debug" >> "$GITHUB_ENV"
          fi

      - name: Setup Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Run Unit & Robolectric Tests
        run: |
          gradle :app:testDebugUnitTest \
            -PappVersionCode=${{ steps.version.outputs.VERSION_CODE }} \
            -PappVersionName=${{ steps.version.outputs.VERSION_NAME }}

      - name: Build Signed APK
        id: build_apk
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          AI_PROXY_URL: ${{ vars.AI_PROXY_URL }}
        run: |
          if [ "$SIGN_MODE" = "release" ]; then
            gradle :app:assembleRelease \
              -PappVersionCode=${{ steps.version.outputs.VERSION_CODE }} \
              -PappVersionName=${{ steps.version.outputs.VERSION_NAME }} \
              -PAI_PROXY_URL="${AI_PROXY_URL}"
            SOURCE_APK="app/build/outputs/apk/release/app-release.apk"
          else
            gradle :app:assembleDebug \
              -PappVersionCode=${{ steps.version.outputs.VERSION_CODE }} \
              -PappVersionName=${{ steps.version.outputs.VERSION_NAME }} \
              -PAI_PROXY_URL="${AI_PROXY_URL}"
            SOURCE_APK="app/build/outputs/apk/debug/app-debug.apk"
          fi

          if [ ! -f "$SOURCE_APK" ]; then
            echo "ERROR: Built APK not found at $SOURCE_APK"
            exit 1
          fi

          mkdir -p dist
          cp "$SOURCE_APK" dist/Ai-Smartphone-Doctor.apk
          SHA256=$(sha256sum dist/Ai-Smartphone-Doctor.apk | awk '{print $1}')
          SIZE_BYTES=$(stat -c%s dist/Ai-Smartphone-Doctor.apk)
          echo "APK_PATH=dist/Ai-Smartphone-Doctor.apk" >> "$GITHUB_OUTPUT"
          echo "APK_SHA256=${SHA256}" >> "$GITHUB_OUTPUT"
          echo "APK_SIZE=${SIZE_BYTES}" >> "$GITHUB_OUTPUT"
          echo "Built dist/Ai-Smartphone-Doctor.apk (${SIZE_BYTES} bytes, sha256=${SHA256})"

      - name: Generate Changelog & Update Manifest JSON
        env:
          RELEASE_DATE_UTC: ${{ steps.version.outputs.RELEASE_DATE_UTC }}
          PUBLISHED_AT: ${{ steps.version.outputs.PUBLISHED_AT }}
          VERSION_CODE: ${{ steps.version.outputs.VERSION_CODE }}
          VERSION_NAME: ${{ steps.version.outputs.VERSION_NAME }}
          APK_SHA256: ${{ steps.build_apk.outputs.APK_SHA256 }}
          APK_SIZE: ${{ steps.build_apk.outputs.APK_SIZE }}
          CUSTOM_EN: ${{ github.event.inputs.release_notes }}
          CUSTOM_HI: ${{ github.event.inputs.release_notes_hi }}
        run: |
          mkdir -p dist
          PREV_TAG=$(git tag --list 'v*' --sort=-v:refname | head -n 1 || true)
          if [ -n "$PREV_TAG" ]; then
            COMMIT_LOG=$(git log "${PREV_TAG}..HEAD" --pretty=format:"- %s (%h)" -n 20)
          else
            COMMIT_LOG=$(git log -n 15 --pretty=format:"- %s (%h)")
          fi
          if [ -z "$COMMIT_LOG" ]; then
            COMMIT_LOG="- Automatic build v${VERSION_NAME} from main branch"
          fi
          export COMMIT_LOG

          python3 - <<'PY'
          import json, os

          repo = os.environ["GITHUB_REPOSITORY"]
          version_code = int(os.environ["VERSION_CODE"])
          version_name = os.environ["VERSION_NAME"]
          tag_name = f"v{version_name}"
          apk_sha256 = os.environ["APK_SHA256"]
          apk_size = int(os.environ["APK_SIZE"])
          published_at = os.environ["PUBLISHED_AT"]
          release_date_utc = os.environ.get("RELEASE_DATE_UTC", "")
          commit_log = os.environ.get("COMMIT_LOG", "").strip()
          custom_en = os.environ.get("CUSTOM_EN", "").strip()
          custom_hi = os.environ.get("CUSTOM_HI", "").strip()

          apk_url = f"https://github.com/{repo}/releases/download/{tag_name}/Ai-Smartphone-Doctor.apk"
          latest_apk_url = f"https://github.com/{repo}/releases/download/latest/Ai-Smartphone-Doctor.apk"

          changelog_lines = [
              f"## AI Smartphone Doctor {tag_name} (Build {version_code})",
              "",
              f"- **Version:** `{tag_name}` (versionCode `{version_code}`)",
              f"- **Release Date:** {release_date_utc}",
              f"- **Direct APK Download Link:** [{tag_name} APK Download]({apk_url})",
              f"- **Always-Latest Channel Link:** [Latest APK Download]({latest_apk_url})",
              "- **Package ID (Preserves Data on Upgrade):** `com.aistudio.smartphonedoctor.oapeir`",
              f"- **SHA-256 Checksum:** `{apk_sha256}`",
              "",
              "### Changelog",
              commit_log,
              "",
              "---",
              "Previous releases remain archived and downloadable from the Releases tab. Installing this update over an existing installation preserves repair logs, diagnostic history, and user session context.",
          ]
          with open("dist/CHANGELOG_RELEASE.md", "w", encoding="utf-8") as cf:
              cf.write("\n".join(changelog_lines) + "\n")

          commit_summary = custom_en if custom_en else commit_log
          notes_en = f"Release {tag_name} ({release_date_utc})\n{commit_summary}"
          notes_hi = custom_hi if custom_hi else f"रिलीज़ {tag_name} ({release_date_utc}): नवीनतम एआई निदान, प्राकृतिक आवाज़ और ऑटो-रिपेयर अपडेट।"

          manifest = {
              "versionCode": version_code,
              "versionName": version_name,
              "apkUrl": apk_url,
              "sha256": apk_sha256,
              "fileSizeBytes": apk_size,
              "releaseNotes": notes_en,
              "releaseNotesHi": notes_hi,
              "publishedAt": published_at,
              "mandatory": False,
          }
          with open("dist/update-manifest.json", "w", encoding="utf-8") as f:
              json.dump(manifest, f, ensure_ascii=False, indent=2)
          PY
          cat dist/update-manifest.json

      - name: Publish Versioned GitHub Release (Preserves Previous Releases)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.VERSION_NAME }}
          name: AI Smartphone Doctor v${{ steps.version.outputs.VERSION_NAME }}
          body_path: dist/CHANGELOG_RELEASE.md
          make_latest: true
          files: |
            dist/Ai-Smartphone-Doctor.apk
            dist/update-manifest.json

      - name: Update Rolling 'latest' Direct Download Channel
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Automatic Update Channel
          body_path: dist/CHANGELOG_RELEASE.md
          prerelease: false
          make_latest: false
          files: |
            dist/Ai-Smartphone-Doctor.apk
            dist/update-manifest.json

      - name: Publish to Firebase App Distribution (Optional)
        if: steps.prep.outputs.HAS_FIREBASE_DIST == 'true'
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_CREDENTIAL_FILE_CONTENT }}
          groups: ${{ secrets.FIREBASE_TESTER_GROUPS || 'testers' }}
          file: dist/Ai-Smartphone-Doctor.apk
          releaseNotes: "v${{ steps.version.outputs.VERSION_NAME }} (${{ steps.version.outputs.VERSION_CODE }}) - Auto build from GitHub main"

      - name: Cleanup Sensitive Files
        if: always()
        run: |
          rm -f .env my-upload-key.jks debug.keystore app/google-services.json
